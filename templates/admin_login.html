{% extends "base.html" %}

{% block content %}

<style>
body {
    background: linear-gradient(-45deg, #59257a, #b81414, #b37c2e, #a81c4e);
    background-size: 400% 400%;
    animation: festiveBG 15s ease infinite;
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
}

@keyframes festiveBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

main.container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
}

.login-container {
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    text-align: center;
    width: 100%;
    max-width: 400px;
    animation: slideUpLogin 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}

@keyframes slideUpLogin {
    0% { transform: translateY(50px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
}

.login-title {
    font-weight: 900;
    margin-bottom: 25px;
    background: linear-gradient(45deg, #ff416c, #ff4b2b);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-size: 32px;
}

.login-input {
    border-radius: 30px;
    padding: 15px 20px;
    border: 3px solid #f9d423;
    outline: none;
    font-size: 16px;
    transition: 0.3s;
}

.login-input:focus {
    border-color: #ff416c;
    box-shadow: 0 0 10px rgba(255, 65, 108, 0.3);
}

.btn-login {
    background: linear-gradient(45deg, #ff416c, #f9d423);
    color: white !important;
    border: none;
    border-radius: 30px;
    font-size: 18px;
    padding: 12px;
    font-weight: bold;
    width: 100%;
    transition: 0.3s;
    box-shadow: 0 6px 15px rgba(255, 65, 108, 0.4);
}

.btn-login:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 8px 20px rgba(255, 65, 108, 0.6);
}

.error-msg {
    color: #ff0844;
    font-weight: bold;
    margin-top: 15px;
    animation: shakeError 0.4s ease-in-out;
}

@keyframes shakeError {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
    75% { transform: translateX(-5px); }
}
</style>

<div class="login-container">
    <h3 class="login-title">Admin Login</h3>

    <form method="post">
        <input type="password" name="password"
         class="form-control mb-4 login-input"
         placeholder="Enter Password">

        <button class="btn btn-login">Login</button>

        {% if error %}
        <p class="error-msg">{{ error }}</p>
        {% endif %}
    </form>
</div>

{% endblock %}
