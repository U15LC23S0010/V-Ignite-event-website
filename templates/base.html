<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>V-Ignite Events</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-semibold" href="/">V-IGNITE</a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
            <div class="ms-auto d-flex gap-2 mt-3 mt-lg-0">
                <a href="/" class="btn btn-outline-light btn-sm">Home</a>
                <a href="/events" class="btn btn-outline-light btn-sm">Events</a>
            </div>
        </div>

    </div>
</nav>

<!-- ================= CONTENT ================= -->
<main class="container py-4">
    {% block content %}{% endblock %}
</main>

<!-- ================= FOOTER ================= -->
<footer class="footer">
    <div class="container text-center">

        <h6 class="fw-semibold mb-2">Vedant BCA & BCom College</h6>

        <p class="small mb-1">Vijayapur, Karnataka</p>

        <p class="small">
            📞 08352-262110 | 📧 vedanta.col@gmail.com
        </p>

        <div class="social-icons mt-2">
            <i class="fab fa-facebook-f me-3"></i>
            <i class="fab fa-instagram"></i>
        </div>

        <p class="small mt-3 mb-0">© 2026 V-Ignite</p>

    </div>
</footer>

<!-- ================= CHATBOT ================= -->

<!-- Floating Button -->
<div id="chatbot-btn" onclick="openChat()">💬</div>

<!-- Fullscreen Chat -->
<div id="chatbot-box">

    <!-- Header -->
    <div id="chat-header">
        <span>🤖 V-IGNITE Assistant</span>
        <span id="chat-close" onclick="closeChat()">✖</span>
    </div>

    <!-- Messages -->
    <div id="chat-messages"></div>

    <!-- Input -->
    <div class="chat-input">
        <input type="text" id="userInput" placeholder="Type your message..."
               onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">➤</button>
    </div>

</div>

<!-- ================= SCRIPTS ================= -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

/* ================= PAGE LOAD ================= */
window.onload = () => {
    document.body.classList.add("loaded");
};

/* ================= CHAT OPEN ================= */
function openChat() {
    document.getElementById("chatbot-box").style.display = "flex";
}

/* ================= CHAT CLOSE ================= */
function closeChat() {
    document.getElementById("chatbot-box").style.display = "none";
}

/* ================= SEND MESSAGE ================= */
function sendMessage() {

    let input = document.getElementById("userInput");
    let message = input.value.trim();

    if (!message) return;

    let chat = document.getElementById("chat-messages");

    // USER MESSAGE
    let userDiv = document.createElement("div");
    userDiv.className = "user-msg";
    userDiv.innerText = message;
    chat.appendChild(userDiv);

    // AUTO SCROLL
    chat.scrollTop = chat.scrollHeight;

    // TYPING EFFECT
    let typing = document.createElement("div");
    typing.className = "bot-msg";
    typing.innerText = "Typing...";
    chat.appendChild(typing);

    chat.scrollTop = chat.scrollHeight;

    // API CALL
    fetch("/chatbot", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ message: message })
    })
    .then(res => res.json())
    .then(data => {

        // REMOVE TYPING
        typing.remove();

        // BOT MESSAGE
        let botDiv = document.createElement("div");
        botDiv.className = "bot-msg";
        botDiv.innerText = data.reply;

        chat.appendChild(botDiv);

        // AUTO SCROLL
        chat.scrollTop = chat.scrollHeight;
    });

    // CLEAR INPUT
    input.value = "";
}

</script>

</body>
</html>
