{% extends "base.html" %}
{% block content %}

<div class="container mt-4">

<h3>Edit Event</h3>

<form method="post" class="card p-4 shadow">

    <input name="name" class="form-control mb-2"
           value="{{ event.name }}" required>

    <textarea name="about"
              class="form-control mb-2"
              required>{{ event.about }}</textarea>

    <input name="logo"
           class="form-control mb-2"
           value="{{ event.logo }}">

    <input name="organizers"
           class="form-control mb-2"
           value="{{ event.organizers  }}"
           required>

    <button class="btn btn-success w-100">
        Save Changes
    </button>

</form>

<br>

<a href="/admin/panel" class="btn btn-secondary">
    ⬅ Back
</a>

</div>

{% endblock %}
